<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Durunda735 | Social Links</title>

  <style>
    :root {
      --background: #0f172a;
      --card-background: rgba(255, 255, 255, 0.12);
      --card-hover: rgba(255, 255, 255, 0.22);
      --text: #ffffff;
      --muted-text: #cbd5e1;
      --accent: #a78bfa;
      --border: rgba(255, 255, 255, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.95)),
        url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2000&q=80")
        center / cover fixed;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    .profile {
      margin-bottom: 25px;
    }

    .profile-image {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid white;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      margin-bottom: 15px;
    }

    .profile h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .profile p {
      color: var(--muted-text);
      font-size: 1rem;
      line-height: 1.5;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 25px;
    }

    .social-icons a {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: white;
      text-decoration: none;
      background: var(--card-background);
      transition: 0.3s ease;
      font-size: 1.2rem;
    }

    .social-icons a:hover {
      background: var(--accent);
      transform: translateY(-4px);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      padding: 17px 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: white;
      text-decoration: none;
      background: var(--card-background);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
    }

    .link-card:hover {
      background: var(--card-hover);
      transform: scale(1.03);
    }

    .link-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--accent);
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .link-text {
      flex: 1;
      text-align: left;
    }

    .link-text strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .link-text span {
      color: var(--muted-text);
      font-size: 0.85rem;
    }

    .arrow {
      font-size: 1.3rem;
      color: var(--muted-text);
    }

    footer {
      margin-top: 30px;
      color: var(--muted-text);
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      .profile h1 {
        font-size: 1.6rem;
      }

      .link-card {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <section class="profile">
      <!-- Replace this URL with your own profile picture -->
      <img
        class="profile-image"
        src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80"
        alt="Durunda735 profile photo"
      />

      <h1>Durunda735</h1>

      <p>
        Welcome to my social links page. Find all of my links below.
      </p>
    </section>

    <div class="social-icons">
      <a
        href="https://github.com/durunda735-eng"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
      >
        ◈
      </a>

      <a
        href="https://www.youtube.com/@The-Resistence-k6z"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
      >
        ▶
      </a>

      <a
        href="mailto:durunda735@proton.me"
        aria-label="Email"
      >
        ✉
      </a>
    </div>

    <main class="links">

      <a
        class="link-card"
        href="https://github.com/durunda735-eng"
        target="_blank"
        rel="noopener noreferrer"
      >
        <div class="link-icon">◈</div>

        <div class="link-text">
          <strong>GitHub</strong>
          <span>View my projects and code</span>
        </div>

        <div class="arrow">›</div>
      </a>

      <a
        class="link-card"
        href="https://www.youtube.com/@The-Resistence-k6z"
        target="_blank"
        rel="noopener noreferrer"
      >
        <div class="link-icon">▶</div>

        <div class="link-text">
          <strong>YouTube</strong>
          <span>Watch my latest videos</span>
        </div>

        <div class="arrow">›</div>
      </a>

      <a
        class="link-card"
        href="mailto:durunda735@proton.me"
      >
        <div class="link-icon">✉</div>

        <div class="link-text">
          <strong>Email Me</strong>
          <span>durunda735@proton.me</span>
        </div>

        <div class="arrow">›</div>
      </a>

    </main>

    <footer>
      © 2026 Durunda735
    </footer>

  </div>
</body>
</html>
